<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Dejan Dakic — live AI and web products, what is in progress, and StratA Talent executive search.">
    <meta property="og:title" content="Dejan Dakic — projects">
    <meta property="og:description" content="BountyRaiders, useToolCraft, BetWithBat, GlitzGlow — and what is being built next.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kidemaestro.github.io/linktree/">
    <meta property="og:image" content="https://kidemaestro.github.io/linktree/assets/social-card.svg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dejan Dakic — projects">
    <meta name="twitter:description" content="BountyRaiders, useToolCraft, BetWithBat, GlitzGlow — and what is being built next.">
    <meta name="theme-color" content="#070b14">
    <link rel="canonical" href="https://kidemaestro.github.io/linktree/">
    <title>Dejan Dakic — projects</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" as="image" href="assets/profile.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#live">Skip to live products</a>

    <div id="app" class="shell">
      <header class="hero">
        <div class="avatar" id="profile-avatar" aria-hidden="true"></div>
        <h1 id="profile-name"></h1>
        <p class="hero__handle" id="profile-handle"></p>
        <p class="hero__role" id="profile-role"></p>
        <p class="hero__tagline" id="profile-tagline"></p>
        <div class="hero__actions" id="profile-actions"></div>
        <p class="hero__note" id="profile-note" hidden></p>
      </header>

      <main>
        <section class="section" id="live" aria-labelledby="live-heading">
          <div class="section__head">
            <h2 id="live-heading">Live now</h2>
            <span class="count" id="live-count"></span>
          </div>
          <p class="section__lede">Open and use these today.</p>
          <ul class="cards" id="live-list"></ul>
        </section>

        <section class="section" id="next" aria-labelledby="next-heading">
          <div class="section__head">
            <h2 id="next-heading">In progress</h2>
            <span class="count" id="next-count"></span>
          </div>
          <p class="section__lede">Not public yet — here so you know what is coming.</p>
          <ul class="queue" id="next-list"></ul>
          <p class="section__note" id="next-note"></p>
        </section>

        <section class="section" id="work" aria-labelledby="work-heading">
          <div class="section__head">
            <h2 id="work-heading">Day job</h2>
          </div>
          <div class="work" id="work-card"></div>
        </section>
      </main>

      <footer class="footer" id="connect">
        <p class="footer__label">Find me</p>
        <nav class="links" id="social-links" aria-label="Social links"></nav>
        <nav class="links links--quiet" id="meta-links" aria-label="Page links"></nav>
        <p class="footer__updated" id="last-updated"></p>
      </footer>
    </div>

    <noscript>
      <div class="shell noscript">
        <h1>Dejan Dakic</h1>
        <p>
          The project list on this page is rendered with JavaScript. With it turned
          off, here are the links that matter most:
          <a href="https://x.com/DakicDejan">X</a>,
          <a href="https://www.linkedin.com/in/dejandakic/">LinkedIn</a>,
          <a href="https://github.com/kidemaestro">GitHub</a>,
          <a href="https://stratatalent.com">StratA Talent</a>.
        </p>
      </div>
    </noscript>

    <script src="data/site.js"></script>
    <script src="assets/script.js"></script>
  </body>
</html>
