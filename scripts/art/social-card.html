<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Social card</title>
    <link rel="stylesheet" href="art.css">
    <style>
      .canvas {
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(620px 420px at -4% -10%, rgba(226, 184, 87, 0.3), transparent 70%),
          radial-gradient(700px 520px at 104% 110%, rgba(99, 132, 255, 0.32), transparent 70%),
          linear-gradient(115deg, #0d0f18 0%, #070a14 55%, #060a1a 100%);
      }

      /* a few stars on the night side */
      .stars {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(1.5px 1.5px at 820px 90px, #fff, transparent),
          radial-gradient(1px 1px at 960px 150px, #cfd9ff, transparent),
          radial-gradient(1.5px 1.5px at 1100px 70px, #fff, transparent),
          radial-gradient(1px 1px at 1040px 250px, #cfd9ff, transparent),
          radial-gradient(1px 1px at 1150px 200px, #fff, transparent),
          radial-gradient(1.2px 1.2px at 900px 40px, #cfd9ff, transparent),
          radial-gradient(1px 1px at 760px 30px, #fff, transparent);
        opacity: 0.8;
      }

      .photo {
        position: absolute;
        top: 132px;
        left: 84px;
        width: 300px;
        height: 300px;
        padding: 8px;
        border-radius: 50%;
        background: conic-gradient(from 200deg, #e2b857, #f6d98a 25%, #9db7ff 55%, #6d8cf0 75%, #e2b857);
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.9);
      }

      .photo img {
        display: block;
        width: 100%;
        height: 100%;
        border: 6px solid #080b14;
        border-radius: 50%;
        object-fit: cover;
      }

      .copy {
        position: absolute;
        top: 104px;
        left: 450px;
        right: 72px;
      }

      .handle {
        color: var(--gold);
        font-size: 21px;
        letter-spacing: 0.04em;
        text-transform: none;
      }

      h1 {
        margin: 18px 0 0;
        font-family: "Fraunces", Georgia, serif;
        font-size: 84px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.035em;
      }

      .headline {
        margin: 26px 0 0;
        font-family: "Fraunces", Georgia, serif;
        font-size: 40px;
        font-weight: 500;
        line-height: 1.18;
        letter-spacing: -0.02em;
        color: #dfe4ef;
      }

      .headline em {
        font-weight: 500;
      }

      .day {
        color: var(--gold);
      }

      .night {
        color: var(--night);
      }

      .foot {
        position: absolute;
        left: 450px;
        right: 72px;
        bottom: 70px;
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .new {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px 12px 12px;
        border: 1px solid rgba(226, 184, 87, 0.45);
        border-radius: 999px;
        font-size: 22px;
        font-weight: 600;
        background: rgba(226, 184, 87, 0.1);
      }

      .new img {
        width: 36px;
        height: 36px;
      }

      .also {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="canvas" id="art">
      <div class="stars"></div>
      <div class="photo"><img src="../../assets/profile.jpg" alt=""></div>

      <div class="copy">
        <div class="handle mono">@DakicDejan</div>
        <h1>Dejan Dakic</h1>
        <p class="headline">
          Placing elite private bankers <em class="day">by day</em>.<br>
          Building AI apps <em class="night">by night</em>.
        </p>
      </div>

      <div class="foot">
        <div class="new"><img src="../../assets/img/lanes-mark.svg" alt=""> New: Lanes.news</div>
        <div class="also mono">BountyRaiders<br>BetWithBat · useToolCraft</div>
      </div>
    </div>
  </body>
</html>
